<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">AI Accuracy Harness control flow</title>
  <desc id="desc">A task passes through a fail-closed router, a proposal-only worker, deterministic validation, sealed evidence, and independent review.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".28"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#93c5fd"/></marker>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <text x="60" y="70" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">Evidence before authority</text>
  <text x="60" y="104" fill="#bfdbfe" font-family="Segoe UI,Arial,sans-serif" font-size="18">Every model result remains a proposal until deterministic checks and independent review pass.</text>
  <g font-family="Segoe UI,Arial,sans-serif" filter="url(#shadow)">
    <g transform="translate(55 155)"><rect width="185" height="130" rx="16" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/><text x="92" y="42" text-anchor="middle" fill="#93c5fd" font-size="15" font-weight="700">1 · CLASSIFY</text><text x="92" y="75" text-anchor="middle" fill="#f8fafc" font-size="21" font-weight="600">Task packet</text><text x="92" y="103" text-anchor="middle" fill="#cbd5e1" font-size="14">Risk · data · oracle</text></g>
    <g transform="translate(280 155)"><rect width="185" height="130" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><text x="92" y="42" text-anchor="middle" fill="#7dd3fc" font-size="15" font-weight="700">2 · ROUTE</text><text x="92" y="75" text-anchor="middle" fill="#f8fafc" font-size="21" font-weight="600">Fail closed</text><text x="92" y="103" text-anchor="middle" fill="#cbd5e1" font-size="14">Exact lane or lead</text></g>
    <g transform="translate(505 155)"><rect width="185" height="130" rx="16" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/><text x="92" y="42" text-anchor="middle" fill="#c4b5fd" font-size="15" font-weight="700">3 · PROPOSE</text><text x="92" y="75" text-anchor="middle" fill="#f8fafc" font-size="21" font-weight="600">No tools</text><text x="92" y="103" text-anchor="middle" fill="#cbd5e1" font-size="14">No mutation · no approval</text></g>
    <g transform="translate(730 155)"><rect width="185" height="130" rx="16" fill="#1e293b" stroke="#34d399" stroke-width="2"/><text x="92" y="42" text-anchor="middle" fill="#6ee7b7" font-size="15" font-weight="700">4 · VERIFY</text><text x="92" y="75" text-anchor="middle" fill="#f8fafc" font-size="21" font-weight="600">Oracle + seal</text><text x="92" y="103" text-anchor="middle" fill="#cbd5e1" font-size="14">Replayable evidence</text></g>
    <g transform="translate(955 155)"><rect width="190" height="130" rx="16" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/><text x="95" y="42" text-anchor="middle" fill="#fde68a" font-size="15" font-weight="700">5 · REVIEW</text><text x="95" y="75" text-anchor="middle" fill="#f8fafc" font-size="21" font-weight="600">Independent lead</text><text x="95" y="103" text-anchor="middle" fill="#cbd5e1" font-size="14">Approve or reject</text></g>
  </g>
  <g stroke="#93c5fd" stroke-width="3" marker-end="url(#arrow)"><path d="M240 220 H272"/><path d="M465 220 H497"/><path d="M690 220 H722"/><path d="M915 220 H947"/></g>
  <rect x="390" y="330" width="420" height="46" rx="23" fill="#312e81" stroke="#818cf8"/><text x="600" y="359" text-anchor="middle" fill="#e0e7ff" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600">Worker authority: PROPOSAL ONLY</text>
</svg>

