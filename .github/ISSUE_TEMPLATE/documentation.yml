name: Documentation improvement
description: Report an unclear, missing, or incorrect explanation or example.
title: "[Docs]: "
labels: [documentation]
body:
  - type: markdown
    attributes:
      value: >-
        Documentation should make the safety boundary and reproducible path easier to verify.
        Do not include secrets, private prompts, or production evidence.
  - type: input
    id: location
    attributes:
      label: Page or section
      placeholder: README.md — Try the router in 60 seconds
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What was unclear or incorrect?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What should a reader be able to do afterward?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
      description: Optional wording, example, diagram, or reproduction detail.

