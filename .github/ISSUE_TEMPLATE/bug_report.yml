name: Bug report
description: Report a reproducible problem in the router, worker, verifier, or documentation.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Do not include API keys, private prompts, production evidence, or restricted source.
        Use private vulnerability reporting for security issues.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v5.0.0 or a commit SHA
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include the command, expected result, and actual result.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use synthetic or otherwise shareable inputs.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, operating system, and relevant model/provider identity.
    validations:
      required: true

